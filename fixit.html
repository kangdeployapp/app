<!DOCTYPE html>
<html>
<head>
  <title>ระบบแจ้งซ่อมโรงเรียนวัดโสดาประดิษฐาราม </title>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwTvzNP112CHhrlxIn8PJAhKLCcg3WohMS0JOgw4zi_Y0nts0XP2msS5j8n-9_by_yt/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
